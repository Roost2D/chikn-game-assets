version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Vite and VitePress move together; splitting them produces unmergeable pull requests.
      vite-toolchain:
        patterns: ['vite', 'vitepress', 'esbuild', 'rollup']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

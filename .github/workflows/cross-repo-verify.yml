name: Verify published release candidates

on:
  workflow_dispatch:
    inputs:
      roost2d_tag:
        description: Roost2D dist-tag to verify
        required: true
        default: next
      chikn_assets_tag:
        description: Chikn asset dist-tag to verify
        required: true
        default: next

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.14.0, cache: npm, registry-url: https://registry.npmjs.org }
      - run: npm ci
      - run: npm run cross:verify
        env:
          ROOST2D_TAG: ${{ inputs.roost2d_tag }}
          CHIKN_ASSETS_TAG: ${{ inputs.chikn_assets_tag }}

name: Publish versioned asset archives

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Builds the archives with no write credential in scope; `npm ci` runs only here.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.14.0, cache: npm }
      - run: npm ci
      - run: npm run release:verify
      - run: npm run release:assemble
      - name: Stage deterministic release artifacts
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ((node -p "require('./package.json').version") -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
          $sourceDir = Join-Path '.release' $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $sourceDir 'release.json'), (Join-Path $sourceDir 'SHA256SUMS') -Destination release
          Get-ChildItem -LiteralPath $sourceDir -File | Where-Object { $_.Extension -in '.zip', '.tgz' } | Copy-Item -Destination release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: release/
          if-no-files-found: error
          retention-days: 1

  # Minimal privileged job: holds `contents: write` behind a dedicated environment boundary, and
  # never installs or executes dependencies.
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: release-archives, path: release }
      - name: Publish immutable GitHub Release assets
        shell: bash
        run: |
          release_flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* "${release_flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

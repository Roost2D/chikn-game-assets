name: Publish asset runtime

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Publish RCs to next. Publish latest only after cross-repository verification succeeds.
        required: true
        type: choice
        options: [next, latest]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: npm, registry-url: https://registry.npmjs.org }
      - run: npm install --global npm@11.5.2
      - run: npm --version
      - run: npm ci
      - run: node scripts/assert-release-channel.mjs ${{ inputs.tag }}
      - run: npm run release:verify
      - run: npm run repro:linux
      - if: inputs.tag == 'latest'
        run: npm run cross:verify
        env: { ROOST2D_TAG: next, CHIKN_ASSETS_TAG: next }
      - run: npm publish -w @chikn-game-assets/runtime --access public --provenance --tag ${{ inputs.tag }}

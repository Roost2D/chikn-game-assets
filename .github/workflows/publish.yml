name: Publish asset runtime

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Publish RCs to next. Publish latest only after cross-repository verification succeeds.
        required: true
        type: choice
        options: [next, latest]

permissions:
  contents: read

jobs:
  # Everything that runs `npm ci` — and therefore arbitrary dependency lifecycle scripts — happens
  # here, with no registry credential and no OIDC token in scope. The job's only output is a tarball.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.14.0, cache: npm }
      - run: npm install --global npm@11.5.2
      - run: npm --version
      - run: npm ci
      - run: node scripts/assert-release-channel.mjs "$TAG"
      - run: npm run release:verify
      - run: npm run repro:linux
      - if: inputs.tag == 'latest'
        run: npx playwright install --with-deps chromium webkit
      - if: inputs.tag == 'latest'
        run: npm run test:browser
      - run: mkdir -p dist-pack
      - run: npm pack -w @chikn-game-assets/runtime --pack-destination dist-pack
      - if: inputs.tag == 'latest'
        name: Verify the exact stable runtime candidate against stable Roost2D
        shell: bash
        run: |
          mapfile -t tarballs < <(find "$GITHUB_WORKSPACE/dist-pack" -type f -name '*.tgz' -print)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            printf 'Expected exactly one stable runtime candidate, found %s\n' "${#tarballs[@]}" >&2
            exit 1
          fi
          ROOST2D_TAG=latest CHIKN_ASSETS_SPEC="${tarballs[0]}" npm run cross:verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-tarball
          path: dist-pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Minimal privileged job: it holds the OIDC token but never installs or executes dependencies.
  # npm trusted publishing authenticates this job through OIDC and automatically records provenance.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.14.0, registry-url: https://registry.npmjs.org }
      # npm trusted publishing requires npm >= 11.5.1. Pin the CLI rather than
      # relying on the older npm bundled with the selected Node release.
      - run: npm install --global npm@11.5.2
      - run: npm --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: runtime-tarball, path: dist-pack }
      - name: Publish the verified tarball
        shell: bash
        run: |
          mapfile -t tarballs < <(find "$GITHUB_WORKSPACE" -type f -name '*.tgz' -print)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            printf 'Expected exactly one verified runtime tarball, found %s\n' "${#tarballs[@]}" >&2
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -print >&2
            exit 1
          fi
          tarball="${tarballs[0]}"
          package_name="$(tar -xOf "$tarball" package/package.json | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => console.log(JSON.parse(input).name));
          ')"
          package_version="$(tar -xOf "$tarball" package/package.json | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => console.log(JSON.parse(input).version));
          ')"
          package_spec="$package_name@$package_version"
          local_integrity="$(node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            console.log(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`);
          ' "$tarball")"
          published_integrity="$(npm view "$package_spec" dist.integrity 2>/dev/null || true)"
          if [[ -n "$published_integrity" ]]; then
            if [[ "$published_integrity" != "$local_integrity" ]]; then
              printf 'Refusing to resume: %s exists with different integrity.\n' "$package_spec" >&2
              exit 1
            fi
            published_tag="$(npm view "$package_name" "dist-tags.$TAG" 2>/dev/null || true)"
            if [[ "$published_tag" != "$package_version" ]]; then
              printf 'Refusing to resume: %s exists but tag %s points to %s. Repair the tag through an authorized operator.\n' "$package_spec" "$TAG" "${published_tag:-nothing}" >&2
              exit 1
            fi
          else
            npm publish "$tarball" --access public --tag "$TAG"
          fi
          verified=false
          for attempt in {1..6}; do
            published_version="$(npm view "$package_spec" version 2>/dev/null || true)"
            published_tag="$(npm view "$package_name" "dist-tags.$TAG" 2>/dev/null || true)"
            if [[ "$published_version" == "$package_version" && "$published_tag" == "$package_version" ]]; then
              verified=true
              break
            fi
            sleep 5
          done
          if [[ "$verified" != true ]]; then
            printf 'Registry postflight failed for %s on tag %s.\n' "$package_spec" "$TAG" >&2
            exit 1
          fi
          printf 'Registry postflight passed for %s (%s).\n' "$package_spec" "$TAG"

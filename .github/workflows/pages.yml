name: Publish asset documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chikn-assets-pages
  cancel-in-progress: true

jobs:
  # The build runs `npm ci`, so it executes dependency lifecycle scripts. Keep it away from the
  # Pages deployment credential: it only ever produces an artifact.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.14.0, cache: npm }
      - run: npm ci
      - run: npm run pages:build
        env:
          DOCS_BASE: /chikn-game-assets/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: docs/.vitepress/dist }

  deploy:
    needs: build
    environment: github-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: true }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22.14.0, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: npm run repro:linux
      - run: npm run pack:check
      - run: npm run docs:build
      - name: Generated reports are committed
        run: git diff --exit-code -- reports manifests

  cross-platform-semantics:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: true }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22.14.0, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Decoded pixels and normalized manifest match canonical report
        run: git diff --exit-code -- reports/reproducibility/semantic.json
